<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Interactive Background Site</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }

    #background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('image_1.jpg'); 
      background-size: cover;
      background-position: center;
      cursor: pointer;
    }

    .click-image {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <div id="background"></div>

  <script>
    const background = document.getElementById('background');

    background.addEventListener('click', (event) => {

      const sound = new Audio('sound_1.mp3'); 
      sound.play();

      const x = event.clientX;
      const y = event.clientY;

      const size = Math.floor(Math.random() * 70) + 30;

      const img = document.createElement('img');
      img.src = 'image_2.png'; 
      img.className = 'click-image';
      img.style.width = `${size}px`;
      img.style.height = 'auto';
      img.style.left = `${x}px`;
      img.style.top = `${y}px`;

      document.body.appendChild(img);
    });
  </script>

</body>
</html>
